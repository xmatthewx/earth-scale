<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Scale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-text-primary:   #1a1a1a;
      --color-text-secondary: #6b6b6b;
      --color-text-tertiary:  #9a9a9a;
      --font-hand: 'Caveat', cursive;
      --font-mono: ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-text-primary:   #e8e8e8;
        --color-text-secondary: #a0a0a0;
        --color-text-tertiary:  #666666;
      }
    }
    body { background: #111; }
  </style>
</head>
<body>

<div style="padding: 1rem 0; font-family: var(--font-hand, cursive);">
  <svg id="diagram" width="100%" style="overflow: visible;"></svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>

<script>
// === CONSTANTS ===
const KM_PER_PX = 2;
const ORIGIN_KM = 800;
const ORIGIN_Y = 20;
const EARTH_R_KM = 6350;
const EARTH_R_PX = EARTH_R_KM / KM_PER_PX;
const AXIS_X = 240;
const TICK_HALF = 5;
const LEADER_LEN = 30;

function y(km) { return ORIGIN_Y + (ORIGIN_KM - km) / KM_PER_PX; }
function mirrorAltitude(km) { return -(EARTH_R_KM * 2) - km; }

function formatAltitude(km) {
  const abs = Math.abs(km);
  const formatted = abs >= 1000 ? abs.toLocaleString() : String(abs);
  return (km < 0 ? '\u2212' : '') + formatted + ' km';
}

// === SVG HELPER ===
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (parent) parent.appendChild(el);
  return el;
}

// === FEATURE DATA ===
const FEATURES = [
  {
    name: 'satellites',
    altitude_km: 800,
    color: null,
    span_km: 0,
    labelSide: 'right',
    mirror: true,
    labelOffset: null,
    major: true,
  },
  {
    name: 'space station',
    altitude_km: 400,
    color: null,
    span_km: 0,
    labelSide: 'right',
    mirror: true,
    labelOffset: { dx: 30, dy: -5 },
    major: true,
  },
  {
    name: 'brooklyn to greenport',
    altitude_km: 160,
    color: null,
    span_km: 0,
    labelSide: 'right',
    mirror: true,
    labelOffset: { dx: 80, dy: -20 },
    major: true,
  },
  {
    name: 'space',
    altitude_km: 100,
    color: null,
    span_km: 0,
    labelSide: 'right',
    mirror: true,
    labelOffset: { dx: 120, dy: -10 },
    major: true,
  },
  {
    name: 'planes & mountains',
    altitude_km: 10,
    color: null,
    span_km: 0,
    labelSide: 'right',
    mirror: true,
    labelOffset: { dx: 140, dy: 0 },
    major: false,
  },
  {
    name: 'deepest ocean',
    altitude_km: -10,
    color: '#185FA5',
    span_km: 10,
    labelSide: 'right',
    mirror: true,
    labelOffset: { dx: 80, dy: 25 },
    major: false,
  },
  {
    name: "center of the earth",
    altitude_km: -6350,
    color: null,
    span_km: 0,
    labelSide: 'right',
    mirror: false,
    labelOffset: null,
    major: true,
  },
];

// === ROUGH.JS SETUP ===
const svg = document.getElementById('diagram');
const rc = rough.svg(svg);

const resolvedTextColor = getComputedStyle(document.documentElement)
  .getPropertyValue('--color-text-primary').trim();

// === VIEWBOX (computed from scale) ===
const topY = y(ORIGIN_KM);
const botY = y(mirrorAltitude(ORIGIN_KM));
const viewH = botY + ORIGIN_Y; // symmetric padding top and bottom
svg.setAttribute('viewBox', '0 0 680 ' + viewH);

// === DRAW HELPERS ===
function drawLine(parent, x1, y1, x2, y2, strokeWidth, { opacity, dashed } = {}) {
  const opts = {
    stroke: resolvedTextColor,
    strokeWidth,
    roughness: 0.8,
  };
  if (dashed) opts.strokeLineDash = [1, 3];
  const node = rc.line(x1, y1, x2, y2, opts);
  if (opacity != null) node.style.opacity = opacity;
  parent.appendChild(node);
}

// === RENDER ===
function renderStructure(svg) {
  const g = svgEl('g', { class: 'structure' }, svg);

  // Vertical axis
  drawLine(g, AXIS_X, topY, AXIS_X, botY, 1, { opacity: 0.33 });

  // Earth body — rough fill, no stroke
  const earthCY = y(-EARTH_R_KM);
  const earthDiam = EARTH_R_PX * 2;
  const body = rc.circle(AXIS_X, earthCY, earthDiam, {
    stroke: 'none', strokeWidth: 0,
    fill: 'white',
    fillStyle: 'cross-hatch',
    fillWeight: 0.1,
    hachureGap: 4,
    roughness: 0.5,
  });
  body.style.opacity = 0.2;
  g.appendChild(body);

  // Habitable zone ring (0–10 km) — green
  const habitableStroke = 10 / KM_PER_PX;
  const habitableR = (EARTH_R_KM + 6) / KM_PER_PX;  // "+5" would be more accurate; adjusted to provide a fine space between this and habitable stroke
  g.appendChild(rc.circle(AXIS_X, earthCY, habitableR * 2, {
    stroke: '#3B6D11',
    strokeWidth: habitableStroke,
    fill: 'none',
    roughness: 0,
  }));

  // Ocean ring (0 to −10 km) — blue
  const oceanStroke = 10 / KM_PER_PX;
  const oceanR = (EARTH_R_KM - 6) / KM_PER_PX; // "-5" would be more accurate; adjusted to provide a fine space between this and habitable stroke
  g.appendChild(rc.circle(AXIS_X, earthCY, oceanR * 2, {
    stroke: '#185FA5',
    strokeWidth: oceanStroke,
    fill: 'none',
    roughness: 0,
  }));

  // Scale label
  svgEl('text', {
    x: 20, y: 16, 'font-size': 11,
    fill: 'var(--color-text-secondary)',
    'font-family': 'var(--font-hand)',
  }, g).textContent = '1 px = ' + KM_PER_PX + ' km';
}

function renderFeatures(svg, features) {
  svg.querySelectorAll('.generated').forEach(el => el.remove());
  const g = svgEl('g', { class: 'generated' }, svg);

  for (const feat of features) {
    renderOneFeature(g, feat, feat.altitude_km, false);
    if (feat.mirror) {
      renderOneFeature(g, feat, mirrorAltitude(feat.altitude_km), true);
    }
  }
}

function renderOneFeature(parent, feat, altitudeKm, isMirrored) {
  const yPos = y(altitudeKm);
  const tickWidth = feat.major ? 1.5 : 1;

  // Tick mark
  drawLine(parent, AXIS_X - TICK_HALF, yPos, AXIS_X + TICK_HALF, yPos, tickWidth);

  // Colored rect (height scales with KM_PER_PX)
  if (feat.color) {
    const h = feat.span_km / KM_PER_PX;
    svgEl('rect', {
      x: AXIS_X - 0.5, y: yPos - h / 2,
      width: 1, height: h,
      fill: feat.color,
    }, parent);
  }

  // Labels
  if (feat.labelSide === 'left') {
    const labelX = AXIS_X - TICK_HALF - 8;

    svgEl('text', {
      x: labelX, y: yPos - 2,
      'text-anchor': 'end', 'font-size': 14,
      fill: 'var(--color-text-primary)',
      'font-family': 'var(--font-hand)',
    }, parent).textContent = feat.name;

    svgEl('text', {
      x: labelX, y: yPos + 8,
      'text-anchor': 'end', 'font-size': 10,
      fill: 'var(--color-text-secondary)',
      'font-family': 'var(--font-hand)',
    }, parent).textContent = formatAltitude(altitudeKm);
  } else {
    // Right-side: leader line + labels
    const offset = feat.labelOffset;
    let leaderEndX, leaderEndY;

    if (offset) {
      const dy = isMirrored ? -offset.dy : offset.dy;
      leaderEndX = AXIS_X + TICK_HALF + offset.dx;
      leaderEndY = yPos + dy;
    } else {
      leaderEndX = AXIS_X + TICK_HALF + LEADER_LEN;
      leaderEndY = yPos;
    }

    drawLine(parent, AXIS_X + TICK_HALF, yPos, leaderEndX, leaderEndY, 0.75, { opacity: 0.5, dashed: true });

    svgEl('text', {
      x: leaderEndX + 5, y: leaderEndY - 2,
      'font-size': 14,
      fill: 'var(--color-text-primary)',
      'font-family': 'var(--font-hand)',
    }, parent).textContent = feat.name;

    svgEl('text', {
      x: leaderEndX + 5, y: leaderEndY + 8,
      'font-size': 10,
      fill: 'var(--color-text-secondary)',
      'font-family': 'var(--font-hand)',
    }, parent).textContent = formatAltitude(altitudeKm);
  }
}

// TODO: If KM_PER_PX becomes dynamic, labelOffset.dy should scale proportionally
// or be replaced with an automatic collision avoidance pass.

renderStructure(svg);
renderFeatures(svg, FEATURES);
</script>

</body>
</html>
