<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Scale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div style="padding: 1rem 0; font-family: var(--font-hand, cursive);">
  <div style="position:fixed; top: 3em; left: 3em; padding: 0 0 0.25rem 0;">
    <span style="font-size: 24px; color: var(--color-text-secondary);">1 px = </span>
    <select id="scale-picker">
      <option value="1">1 km</option>
      <option value="2">2 km</option>
      <option value="5">5 km</option>
      <option value="10">10 km</option>
      <option value="25">25 km</option>
      <option value="100">100 km</option>
    </select>
  </div>
  <svg id="diagram" width="100%" style="overflow: visible;"></svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<script src="features.js"></script>
<script src="terra.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>

</body>
</html>
